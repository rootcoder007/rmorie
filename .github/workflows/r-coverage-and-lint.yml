#
# r-coverage-and-lint.yml -- covr + lintr + goodpractice (covr +
# cyclocomp + lintr + rcmdcheck rolled up) + rOpenSci pkgcheck.
#
# Triggered via the build.yml orchestrator (workflow_call) and
# workflow_dispatch for manual debugging.
name: R coverage + lint + goodpractice

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MAKEFLAGS: "-j4"

permissions:
  contents: read

jobs:
  coverage:
    name: covr + codecov
    runs-on: ubuntu-latest

    env:
      _R_CHECK_FORCE_SUGGESTS_: false
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: r-lib/actions/setup-r@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2
        with:
          extra-packages: any::covr any::xml2
          needs: coverage

      - name: Run covr
        run: |
          Rscript -e 'cov <- covr::package_coverage(type = "tests", quiet = TRUE); covr::to_cobertura(cov, filename = "coverage.xml"); cat(sprintf("Coverage: %.2f%%\n", covr::percent_coverage(cov)))'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: r-tests
          fail_ci_if_error: false
        continue-on-error: true

  lint:
    name: lintr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: r-lib/actions/setup-r@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2
        with:
          extra-packages: any::lintr
      - name: Run lintr
        run: Rscript -e 'lintr::lint_package()'

  goodpractice:
    # Rolls up covr + cyclocomp + lintr + rcmdcheck into a single
    # report. The rOpenSci editorial checklist runs this for every
    # submitted package.
    name: goodpractice (covr + cyclocomp + lintr + rcmdcheck)
    runs-on: ubuntu-latest

    env:
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: r-lib/actions/setup-pandoc@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2
      - uses: r-lib/actions/setup-r@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2
        with:
          extra-packages: any::goodpractice any::rcmdcheck any::covr any::cyclocomp any::lintr

      - name: Run goodpractice
        run: Rscript -e 'g <- goodpractice::gp("."); print(g)'

  pkgcheck:
    # rOpenSci's own check -- runs pkgstats + covr + goodpractice +
    # rcmdcheck internally and produces the markdown comment the
    # rOpenSci bot uses on the review thread.
    name: rOpenSci pkgcheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: r-lib/actions/setup-pandoc@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2
      - uses: r-lib/actions/setup-r@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # pkgcheck's internal rcmdcheck builds the PDF manual, which
      # needs the `inconsolata` LaTeX font. Without it pkgcheck
      # reports a spurious "R CMD check found 1 warning".
      - uses: r-lib/actions/setup-tinytex@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2
      - name: Install LaTeX helpers
        run: |
          tlmgr update --self
          tlmgr install inconsolata helvetic times courier ec parskip url upquote

      - name: Install universal-ctags
        run: |
          sudo apt-get update -y
          sudo apt-get install -y universal-ctags

      - uses: r-lib/actions/setup-r-dependencies@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::goodpractice
            any::cyclocomp
            ropensci-review-tools/pkgstats
            ropensci-review-tools/pkgcheck

      - name: Run pkgcheck
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'cks <- pkgcheck::pkgcheck("."); md <- pkgcheck::checks_to_markdown(cks); writeLines(md, "pkgcheck.md"); cat(md)'

      - name: Upload pkgcheck.md
        uses: actions/upload-artifact@v5
        with:
          name: pkgcheck-markdown
          path: pkgcheck.md
