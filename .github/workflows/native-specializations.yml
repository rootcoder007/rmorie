# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Branch gate for feat/native-specializations: every push must pass
# R CMD check --as-cran in the hard-deps flavour (the whole point of
# the branch is zero-Suggests engines) plus the three native test
# tiers. Debian bookworm container: P3M binaries keep it fast.
name: native-specializations

on:
  push:
    branches: [feat/native-specializations]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  as-cran-hard-deps:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.5.1
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Static guard -- every morie_* call must be defined
        run: Rscript scripts/audit/check_r_undefined.R .
      - name: System libraries + toolchain
        run: apt-get update -qq && apt-get install -y --no-install-recommends build-essential libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Point every R process at a live P3M stream
        # rocker images bake a DATED P3M snapshot into Rprofile.site, and
        # P3M prunes old dates -- 2025-10-30 started returning 404 and
        # failed this job for a reason unrelated to the package. Derive
        # the codename from the image itself rather than assuming it, and
        # pin to `latest` so it cannot rot again.
        run: |
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-noble}"
          RHOME=$(R RHOME)
          echo "container: $ID $VERSION_ID ($CODENAME)"
          printf 'options(repos = c(runiverse = "https://rootcoder007.r-universe.dev", P3M = "https://packagemanager.posit.co/cran/__linux__/%s/latest", CRAN = "https://cloud.r-project.org"))\n' "$CODENAME" >> "$RHOME/etc/Rprofile.site"
          Rscript -e 'cat("repos now:\n"); print(getOption("repos"))'
        shell: bash
      - name: Install hard dependencies + tooling
        run: |
          options(HTTPUserAgent = sprintf(
            "R/%s R (%s)", getRversion(),
            paste(getRversion(), R.version["platform"],
                  R.version["arch"], R.version["os"])))
          # Set in Rprofile.site by the step above, with the codename
          # taken from the running image. Re-declaring it here is how the
          # wrong distro got in.
          repos <- getOption("repos")
          pkgs <- c("here", "Rcpp", "RcppArmadillo", "rmoriebricklayer", "rmoriedata",
                    "testthat", "pkgload", "rcmdcheck")
          install.packages(pkgs, repos = repos, Ncpus = 2)
          missing <- setdiff(pkgs, rownames(installed.packages()))
          if (length(missing) > 0) stop("failed to install: ",
                                        paste(missing, collapse = ", "))
        shell: Rscript {0}
      - name: Native test tiers (structural + cross + property)
        run: |
          pkgload::load_all(quiet = TRUE)
          bad <- 0L
          for (f in c(Sys.glob("tests/testthat/test-matching-native.R"),
                      Sys.glob("tests/cross/*.R"),
                      Sys.glob("tests/property/*.R"))) {
            d <- as.data.frame(testthat::test_file(f, reporter = "summary"))
            bad <- bad + sum(d$failed) + sum(d$error)
          }
          if (bad > 0) stop(bad, " native-tier failures")
        shell: Rscript {0}
      - name: R CMD check (as-cran, no vignettes)
        # donttest examples are NOT executed here: --as-cran turns them on
        # and the network-fetch examples crawl on GitHub runners (cold
        # caches, throttled services) until the job hits its own
        # timeout-minutes — every "cancelled" gate run was exactly that.
        # donttest execution is gated on the L14 self-hosted environment
        # instead (blackholed + live runs).
        env:
          _R_CHECK_DONTTEST_EXAMPLES_: false
        run: |
          res <- rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran", "--ignore-vignettes"),
            build_args = c("--no-build-vignettes", "--no-manual"),
            error_on = "error")
          print(res)
        shell: Rscript {0}
      - name: Upload check logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-spec-check-logs
          path: |
            check/*.Rcheck/00check.log
            check/*.Rcheck/tests/
          if-no-files-found: ignore
          retention-days: 7
