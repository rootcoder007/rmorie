# Clean-user smoke: install this commit on three OSes and run every `rmorie` verb for real
# in an empty HOME (inst/smoke/smoke.R). The tag is only cut when this and `build` are green.
name: smoke
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: |
            https://rootcoder007.r-universe.dev
            https://stan-dev.r-universe.dev
      - id: deps
        continue-on-error: true
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgload any::testthat any::withr any::httr2 any::jsonlite any::DBI any::RSQLite any::duckdb any::xml2 any::readxl
      - name: install dependencies with base R (when pak cannot solve)
        if: steps.deps.outcome == 'failure'
        shell: Rscript {0}
        run: |
          repos <- c("https://rootcoder007.r-universe.dev", "https://stan-dev.r-universe.dev", "https://cloud.r-project.org")
          install.packages(c("remotes", "pkgload", "testthat", "withr", "httr2", "jsonlite", "DBI", "RSQLite", "duckdb", "xml2", "readxl"), repos = repos)
          remotes::install_deps(".", dependencies = NA, repos = repos, upgrade = "never")
      - name: install
        shell: bash
        run: R CMD INSTALL .
      - name: smoke
        env:
          MORIE_SMOKE_KEY: ${{ secrets.MORIE_SMOKE_KEY }}
          MORIE_SMOKE_PKG: rmorie
        run: Rscript inst/smoke/smoke.R
