# Clean-user smoke: install this commit on three OSes and run every `rmorie` verb for real
# in an empty HOME (inst/smoke/smoke.R). The tag is only cut when this and `build` are green.
name: smoke
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::testthat, any::withr
      - name: install
        run: R CMD INSTALL .
      - name: smoke
        env:
          MORIE_SMOKE_KEY: ${{ secrets.MORIE_SMOKE_KEY }}
          MORIE_SMOKE_PKG: rmorie
        run: Rscript inst/smoke/smoke.R
