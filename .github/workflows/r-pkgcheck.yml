# SPDX-License-Identifier: AGPL-3.0-or-later
#
# r-pkgcheck.yml -- rOpenSci's pkgcheck via the official containerized
# pkgcheck-action. The container ships pkgstats/ami/ctags/cloc pre-built,
# which avoids the pak dependency-resolution conflicts (pkgstats->ami,
# cyclocomp) that broke the previous manual setup-r-dependencies install.
# This is the same engine the @ropensci-review-bot uses on review threads.
# Called via build.yml (workflow_call) or manually (workflow_dispatch).
name: rOpenSci pkgcheck

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pkgcheck:
    name: rOpenSci pkgcheck
    runs-on: ubuntu-latest
    # rmorie is dependency-heavy (~150 Suggests) so pkgcheck legitimately
    # runs ~1-2h (install + covr + R CMD check over 1855 functions). Cap it
    # so an upstream binary-repo (r2u) outage can't silently burn 6h.
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    steps:
      - uses: ropensci-review-tools/pkgcheck-action@fa6dc3e9dec0580397ae44ec6fb9e7953947758c # main
        with:
          ref: ${{ github.sha }}
          post-to-issue: false
          summary-only: false
