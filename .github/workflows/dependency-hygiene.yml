# Structural enforcement of the self-sufficiency claim (phase 27):
# no forbidden statistical package may appear in Depends/Imports.
# Suggests is allowed ONLY for tests/cross/ cross-validation, the
# documented optional parser/ML accelerators, and the documented
# extenders (R/extenders_*.R).
name: dependency-hygiene

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/native-specializations]

permissions:
  contents: read

jobs:
  dependency-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Forbidden-dependency check
        run: |
          python3 - <<'PY'
          import re, sys
          txt = open("DESCRIPTION").read()
          # DCF: capture a field's folded value
          def field(name):
              m = re.search(rf"^{name}:(.*?)(?=^\S|\Z)", txt,
                            re.M | re.S)
              if not m:
                  return []
              raw = m.group(1)
              return [re.sub(r"\(.*?\)", "", e).strip()
                      for e in raw.split(",") if e.strip()]
          have = field("Depends") + field("Imports") + field("LinkingTo")
          forbidden = {"MatchIt","optmatch","Matching","designmatch",
              "survey","DoubleML","mlr3","ranger","grf","dagitty",
              "rdrobust","did","fixest","DRDID","bacondecomp",
              "DIDmultiplegt","TwoWayFEWeights","HonestDiD","coresynth",
              "AER","ivreg","gmm","plm","psych","mirt","gstat","spdep",
              "signal","wavelets","hawkes","emhawkes","bsts","xml2",
              "jsonlite","arrow","httr","httr2","digest","openssl"}
          hit = sorted(forbidden & set(have))
          if hit:
              sys.exit("FORBIDDEN DEPS PRESENT: " + ", ".join(hit))
          print("Dependency check: PASS")
          print("Depends/Imports/LinkingTo:", ", ".join(have))
          PY
      - name: Production code must not call forbidden packages
        run: |
          # tests/cross/ is the only place reference packages may be
          # exercised; production R/ may reference them only inside the
          # requireNamespace-guarded accelerator shims (jsonlite, xml2,
          # arrow), the documented extenders (R/extenders_*.R), or the
          # pinned .morie_*_have_* probes (which never use pkg::).
          set -e
          # Temporary allowlist (tracked follow-up: nativize these
          # guarded legacy surfaces — full/subclass matching, DML-PLIV,
          # svydesign/svymean wrappers, one OTIS matchit helper):
          #   R/matching.R R/effects.R R/survey.R R/weights.R
          #   R/otis_causal.R
          bad=$(grep -rnE "(MatchIt|survey|DoubleML|grf|dagitty|rdrobust|fixest|DRDID|bacondecomp|DIDmultiplegt|TwoWayFEWeights|HonestDiD|coresynth|ivreg|gmm|plm|psych|gstat|spdep|signal|wavelets|emhawkes|digest|openssl)::" R/ --include="*.R" \
            | grep -v "^R/RcppExports.R" \
            | grep -v "^R/extenders_" \
            | grep -vE "^R/(matching|effects|survey|weights|otis_causal)\.R:" \
            | grep -vE "^R/[a-z_0-9]+\.R:[0-9]+:\s*#" || true)
          if [ -n "$bad" ]; then
            echo "Forbidden package calls in production R/:"
            echo "$bad"
            exit 1
          fi
          echo "Production-call check: PASS"
