# Runs the test suite with ONLY hard dependencies (Depends/Imports/
# LinkingTo) installed — the exact environment of a user who ran
# install.packages("rmorie") and nothing else. Every optional-package
# test must skip, not error; this job makes that a permanent guarantee
# instead of a one-time audit fix.
name: r-minimal-deps

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NOT_CRAN: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
          extra-repositories: |
            https://rootcoder007.r-universe.dev

      # pak's worker processes run vanilla R and never read any Rprofile, so
      # repos set there (including use-public-rspm's) are invisible to it --
      # it fell back to cran.rstudio.com SOURCE and compiled 118 deps until
      # the job timed out. PKG_CRAN_MIRROR is pak's own env knob and env
      # survives vanilla subprocesses. RSPM is Linux-only, so other legs
      # are untouched.
      - name: Point pak at the P3M binary mirror
        shell: bash
        run: |
          if [ -n "${RSPM:-}" ]; then
            echo "PKG_CRAN_MIRROR=${RSPM}" >> "$GITHUB_ENV"
            echo "pak CRAN mirror -> ${RSPM}"
          fi

      - name: System libraries (libcurl for the C++ backend)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      # No pak: its solver ignores the runner's repo profile, so the
      # r-universe-only hard dep cannot resolve (and its "hard" filter
      # proved unreliable here). The hard-dependency set is tiny --
      # install it directly with explicit repositories.
      - name: Install hard dependencies + test tooling (no Suggests)
        run: |
          # P3M serves prebuilt Linux binaries for CRAN packages: no
          # source compiles (the fs package has a parallel-make race
          # when built from source) and installs finish in ~2 minutes.
          options(HTTPUserAgent = sprintf(
            "R/%s R (%s)", getRversion(),
            paste(getRversion(), R.version["platform"],
                  R.version["arch"], R.version["os"])))
          repos <- c(
            P3M = "https://packagemanager.posit.co/cran/__linux__/noble/latest",      # CRAN binaries for this distro
            CRAN = "https://cloud.r-project.org",   # rmoriebricklayer 0.5.0 until P3M mirrors it
            runiverse = "https://rootcoder007.r-universe.dev")  # rmoriedata until it clears CRAN review
          install.packages(c("here", "Rcpp", "RcppArmadillo",
                             "rmoriebricklayer", "rmoriedata", "testthat", "pkgload"),
                           repos = repos, Ncpus = 2)
          # r-universe serves the released build; a branch that raises the floor in DESCRIPTION is
          # ahead of it, so the floor and the branch are read from DESCRIPTION and built from GitHub
          # when the installed build is older (pak honours Remotes, install.packages() does not)
          desc <- read.dcf("DESCRIPTION")
          imports <- gsub("[[:space:]]+", " ", c(desc[1, intersect(c("Imports", "Depends"), colnames(desc))], ""))
          floor <- sub(".*rmoriebricklayer \\(>= ([0-9.]+)\\).*", "\\1", paste(imports, collapse = " "))
          if (!grepl("^[0-9.]+$", floor)) floor <- "0.0.0"
          remotes <- if ("Remotes" %in% colnames(desc)) desc[1, "Remotes"] else ""
          ref <- sub(".*rmorie-bricklayer@([A-Za-z0-9._/-]+).*", "\\1", remotes)
          if (identical(ref, remotes) || !grepl("^[A-Za-z0-9._/-]+$", ref)) ref <- "main"
          if (!nzchar(system.file(package = "rmoriebricklayer")) ||
              utils::packageVersion("rmoriebricklayer") < floor) {
            tf <- tempfile(fileext = ".tar.gz")
            download.file(sprintf("https://github.com/rootcoder007/rmorie-bricklayer/archive/%s.tar.gz", ref),
                          tf, mode = "wb", quiet = TRUE)
            install.packages(tf, repos = NULL, type = "source")
          }
          # the same for rmoriedata: its floor and branch from DESCRIPTION, built from GitHub when the
          # installed build is older (it needs the rmoriebricklayer just installed)
          dfloor <- sub(".*rmoriedata \\(>= ([0-9.]+)\\).*", "\\1", paste(imports, collapse = " "))
          if (!grepl("^[0-9.]+$", dfloor)) dfloor <- "0.0.0"
          dref <- sub(".*rootcoder007/rmoriedata@([A-Za-z0-9._/-]+).*", "\\1", remotes)
          if (identical(dref, remotes) || !grepl("^[A-Za-z0-9._/-]+$", dref)) dref <- "main"
          if (!nzchar(system.file(package = "rmoriedata")) ||
              utils::packageVersion("rmoriedata") < dfloor) {
            tf <- tempfile(fileext = ".tar.gz")
            download.file(sprintf("https://github.com/rootcoder007/rmoriedata/archive/%s.tar.gz", dref),
                          tf, mode = "wb", quiet = TRUE)
            install.packages(tf, repos = NULL, type = "source")
          }
          missing <- setdiff(c("here", "Rcpp", "RcppArmadillo",
                               "rmoriebricklayer", "rmoriedata", "testthat", "pkgload"),
                             rownames(installed.packages()))
          if (length(missing) > 0) stop("failed to install: ",
                                        paste(missing, collapse = ", "))
        shell: Rscript {0}
      - name: Run tests without any Suggests packages
        run: |
          # parallel testthat starts workers that load the *installed*
          # package by name; a load_all() session has none, so run serially
          Sys.setenv(TESTTHAT_PARALLEL = "FALSE")
          pkgload::load_all(quiet = TRUE)
          res <- testthat::test_dir("tests/testthat",
                                    stop_on_failure = FALSE,
                                    reporter = "summary")
          d <- as.data.frame(res)
          cat(sprintf("\nfailed: %d errors: %d passed: %d skipped: %d\n",
                      sum(d$failed), sum(d$error),
                      sum(d$passed), sum(d$skipped)))
          if (sum(d$failed) + sum(d$error) > 0) {
            stop("Tests must SKIP, not fail, when Suggests are absent.")
          }
        shell: Rscript {0}
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minimal-deps-test-log
          path: |
            testthat.Rout*
            *.Rout
          if-no-files-found: ignore
          retention-days: 7

  # Debian portability leg. The ubuntu cells do NOT prove Debian: different
  # glibc/toolchain snapshots and different P3M binary streams. rocker/r-ver turned out to be
  # UBUNTU-based (found 2026-07-15) — this job now runs true Debian
  # bookworm with R from CRAN's apt repo; P3M bookworm binaries match. Same bare-install contract as the ubuntu minimal job.
  debian:
    runs-on: ubuntu-latest
    container: r-base:4.5.1
    timeout-minutes: 90
    env:
      NOT_CRAN: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Debian toolchain
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq build-essential libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Install hard dependencies + test tooling (no Suggests)
        run: |
          options(HTTPUserAgent = sprintf(
            "R/%s R (%s)", getRversion(),
            paste(getRversion(), R.version["platform"],
                  R.version["arch"], R.version["os"])))
          repos <- c(
            P3M = "https://packagemanager.posit.co/cran/__linux__/bookworm/latest",      # CRAN binaries for this distro
            CRAN = "https://cloud.r-project.org",   # rmoriebricklayer 0.5.0 until P3M mirrors it
            runiverse = "https://rootcoder007.r-universe.dev")  # rmoriedata until it clears CRAN review
          pkgs <- c("here", "Rcpp", "RcppArmadillo",
                    "rmoriebricklayer", "rmoriedata", "testthat", "pkgload")
          for (attempt in 1:4) {
            missing <- setdiff(pkgs, rownames(installed.packages()))
            if (length(missing) == 0) break
            # one bad download from r-universe or P3M must not fail the job
            try(install.packages(missing, repos = repos, Ncpus = 2))
            if (attempt < 4) Sys.sleep(30 * attempt)
          }
          # r-universe unreachable: build the two in-house packages from GitHub
          gh <- c(rmoriebricklayer = "https://github.com/rootcoder007/rmorie-bricklayer/archive/refs/heads/main.tar.gz",
                  rmoriedata = "https://github.com/rootcoder007/rmoriedata/archive/refs/heads/main.tar.gz")
          for (p in intersect(names(gh), setdiff(pkgs, rownames(installed.packages())))) {
            tf <- tempfile(fileext = ".tar.gz")
            got <- tryCatch({ download.file(gh[[p]], tf, mode = "wb", quiet = TRUE); TRUE },
                            error = function(e) FALSE)
            if (got) try(install.packages(tf, repos = NULL, type = "source"))
          }
          # r-universe serves the released build; a branch that raises the floor in DESCRIPTION is
          # ahead of it, so the floor and the branch are read from DESCRIPTION and built from GitHub
          # when the installed build is older (pak honours Remotes, install.packages() does not)
          desc <- read.dcf("DESCRIPTION")
          imports <- gsub("[[:space:]]+", " ", c(desc[1, intersect(c("Imports", "Depends"), colnames(desc))], ""))
          floor <- sub(".*rmoriebricklayer \\(>= ([0-9.]+)\\).*", "\\1", paste(imports, collapse = " "))
          if (!grepl("^[0-9.]+$", floor)) floor <- "0.0.0"
          remotes <- if ("Remotes" %in% colnames(desc)) desc[1, "Remotes"] else ""
          ref <- sub(".*rmorie-bricklayer@([A-Za-z0-9._/-]+).*", "\\1", remotes)
          if (identical(ref, remotes) || !grepl("^[A-Za-z0-9._/-]+$", ref)) ref <- "main"
          if (!nzchar(system.file(package = "rmoriebricklayer")) ||
              utils::packageVersion("rmoriebricklayer") < floor) {
            tf <- tempfile(fileext = ".tar.gz")
            download.file(sprintf("https://github.com/rootcoder007/rmorie-bricklayer/archive/%s.tar.gz", ref),
                          tf, mode = "wb", quiet = TRUE)
            install.packages(tf, repos = NULL, type = "source")
          }
          # the same for rmoriedata: its floor and branch from DESCRIPTION, built from GitHub when the
          # installed build is older (it needs the rmoriebricklayer just installed)
          dfloor <- sub(".*rmoriedata \\(>= ([0-9.]+)\\).*", "\\1", paste(imports, collapse = " "))
          if (!grepl("^[0-9.]+$", dfloor)) dfloor <- "0.0.0"
          dref <- sub(".*rootcoder007/rmoriedata@([A-Za-z0-9._/-]+).*", "\\1", remotes)
          if (identical(dref, remotes) || !grepl("^[A-Za-z0-9._/-]+$", dref)) dref <- "main"
          if (!nzchar(system.file(package = "rmoriedata")) ||
              utils::packageVersion("rmoriedata") < dfloor) {
            tf <- tempfile(fileext = ".tar.gz")
            download.file(sprintf("https://github.com/rootcoder007/rmoriedata/archive/%s.tar.gz", dref),
                          tf, mode = "wb", quiet = TRUE)
            install.packages(tf, repos = NULL, type = "source")
          }
          missing <- setdiff(pkgs, rownames(installed.packages()))
          if (length(missing) > 0) stop("failed to install: ",
                                        paste(missing, collapse = ", "))
        shell: Rscript {0}
      - name: Run tests on Debian without any Suggests packages
        run: |
          # parallel testthat starts workers that load the *installed*
          # package by name; a load_all() session has none, so run serially
          Sys.setenv(TESTTHAT_PARALLEL = "FALSE")
          pkgload::load_all(quiet = TRUE)
          res <- testthat::test_dir("tests/testthat",
                                    stop_on_failure = FALSE,
                                    reporter = "summary")
          d <- as.data.frame(res)
          cat(sprintf("\nfailed: %d errors: %d passed: %d skipped: %d\n",
                      sum(d$failed), sum(d$error),
                      sum(d$passed), sum(d$skipped)))
          if (sum(d$failed) + sum(d$error) > 0) {
            stop("Tests must SKIP, not fail, when Suggests are absent.")
          }
        shell: Rscript {0}
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minimal-deps-debian-test-log
          path: |
            testthat.Rout*
            *.Rout
          if-no-files-found: ignore
          retention-days: 7

  # Fedora / RHEL-family leg (dnf + different glibc/toolchain stream from
  # the Debian-family jobs above). P3M ships rhel9 binaries that work on
  # Fedora; the same bare-install contract applies.
  fedora:
    runs-on: ubuntu-latest
    container: fedora:42
    timeout-minutes: 90
    env:
      NOT_CRAN: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System R + toolchain
        run: dnf install -y --setopt=install_weak_deps=False R-core-devel gcc-c++ libcurl-devel openssl-devel && dnf clean all
      - name: Install hard dependencies + test tooling (no Suggests)
        run: |
          options(HTTPUserAgent = sprintf(
            "R/%s R (%s)", getRversion(),
            paste(getRversion(), R.version["platform"],
                  R.version["arch"], R.version["os"])))
          repos <- c(
            runiverse = "https://rootcoder007.r-universe.dev",
            P3M = "https://packagemanager.posit.co/cran/__linux__/rhel9/latest",
            CRAN = "https://cloud.r-project.org")
          pkgs <- c("here", "Rcpp", "RcppArmadillo",
                    "rmoriebricklayer", "rmoriedata", "testthat", "pkgload")
          for (attempt in 1:4) {
            missing <- setdiff(pkgs, rownames(installed.packages()))
            if (length(missing) == 0) break
            # one bad download from r-universe or P3M must not fail the job
            try(install.packages(missing, repos = repos, Ncpus = 2))
            if (attempt < 4) Sys.sleep(30 * attempt)
          }
          # r-universe serves the released build; a branch that raises the floor in DESCRIPTION is
          # ahead of it, so the floor and the branch are read from DESCRIPTION and built from GitHub
          # when the installed build is older (pak honours Remotes, install.packages() does not)
          desc <- read.dcf("DESCRIPTION")
          imports <- gsub("[[:space:]]+", " ", c(desc[1, intersect(c("Imports", "Depends"), colnames(desc))], ""))
          floor <- sub(".*rmoriebricklayer \\(>= ([0-9.]+)\\).*", "\\1", paste(imports, collapse = " "))
          if (!grepl("^[0-9.]+$", floor)) floor <- "0.0.0"
          remotes <- if ("Remotes" %in% colnames(desc)) desc[1, "Remotes"] else ""
          ref <- sub(".*rmorie-bricklayer@([A-Za-z0-9._/-]+).*", "\\1", remotes)
          if (identical(ref, remotes) || !grepl("^[A-Za-z0-9._/-]+$", ref)) ref <- "main"
          if (!nzchar(system.file(package = "rmoriebricklayer")) ||
              utils::packageVersion("rmoriebricklayer") < floor) {
            tf <- tempfile(fileext = ".tar.gz")
            download.file(sprintf("https://github.com/rootcoder007/rmorie-bricklayer/archive/%s.tar.gz", ref),
                          tf, mode = "wb", quiet = TRUE)
            install.packages(tf, repos = NULL, type = "source")
          }
          # the same for rmoriedata: its floor and branch from DESCRIPTION, built from GitHub when the
          # installed build is older (it needs the rmoriebricklayer just installed)
          dfloor <- sub(".*rmoriedata \\(>= ([0-9.]+)\\).*", "\\1", paste(imports, collapse = " "))
          if (!grepl("^[0-9.]+$", dfloor)) dfloor <- "0.0.0"
          dref <- sub(".*rootcoder007/rmoriedata@([A-Za-z0-9._/-]+).*", "\\1", remotes)
          if (identical(dref, remotes) || !grepl("^[A-Za-z0-9._/-]+$", dref)) dref <- "main"
          if (!nzchar(system.file(package = "rmoriedata")) ||
              utils::packageVersion("rmoriedata") < dfloor) {
            tf <- tempfile(fileext = ".tar.gz")
            download.file(sprintf("https://github.com/rootcoder007/rmoriedata/archive/%s.tar.gz", dref),
                          tf, mode = "wb", quiet = TRUE)
            install.packages(tf, repos = NULL, type = "source")
          }
          missing <- setdiff(pkgs, rownames(installed.packages()))
          if (length(missing) > 0) stop("failed to install: ",
                                        paste(missing, collapse = ", "))
        shell: Rscript {0}
      - name: Run tests on Fedora without any Suggests packages
        run: |
          # parallel testthat starts workers that load the *installed*
          # package by name; a load_all() session has none, so run serially
          Sys.setenv(TESTTHAT_PARALLEL = "FALSE")
          pkgload::load_all(quiet = TRUE)
          res <- testthat::test_dir("tests/testthat",
                                    stop_on_failure = FALSE,
                                    reporter = "summary")
          d <- as.data.frame(res)
          cat(sprintf("\nfailed: %d errors: %d passed: %d skipped: %d\n",
                      sum(d$failed), sum(d$error),
                      sum(d$passed), sum(d$skipped)))
          if (sum(d$failed) + sum(d$error) > 0) {
            stop("Tests must SKIP, not fail, when Suggests are absent.")
          }
        shell: Rscript {0}
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minimal-deps-fedora-test-log
          path: |
            testthat.Rout*
            *.Rout
          if-no-files-found: ignore
          retention-days: 7
