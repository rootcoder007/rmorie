#
# r-cmd-check.yml -- consolidated R CMD check + lint/covr/goodpractice.
#
# Refactor 3MMM.62 + 3MMM.64 (2026-05-25): folds the previously-standalone
# r-lint, r-coverage, and r-goodpractice workflows into POST-CHECK steps
# on the ubuntu-latest + release cell so they share the installed R
# library and built package state. Saves ~3 redundant install+compile
# passes per build.
#
# r-pkgcheck.yml stays separate -- pkgcheck/pkgstats are GitHub-only
# (ropensci-review-tools/*), need universal-ctags system dep, and run
# their own LaTeX PDF build. Embedding here triggered pak dependency-
# resolution failures (3MMM.64); leaving it as a workflow_call leaf
# under build.yml is cheaper than the workarounds.
#
# Topology:
#   matrix R-CMD-check (5 cells: mac/win/ubuntu-{release,devel,oldrel-1})
#     |-- check-r-package (all cells)
#     |-- (ubuntu-release only) lintr + covr + goodpractice
#     |-- (ubuntu-release only) codecov upload
#
# Standalone r-lint.yml / r-coverage.yml / r-goodpractice.yml are
# retained as workflow_dispatch-only for manual debugging.
name: R CMD check

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Parallel compile for source-installed Suggests (C++ heavy deps).
  MAKEFLAGS: "-j4"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-latest,   r: 'release' }
          - { os: windows-2025,   r: 'release' }
          - { os: ubuntu-latest,  r: 'release' }
          - { os: ubuntu-latest,  r: 'devel'   }
          - { os: ubuntu-latest,  r: 'oldrel-1' }

    env:
      _R_CHECK_FORCE_SUGGESTS_: false
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: r-lib/actions/setup-pandoc@2e3959d284a9ed60162f28a0f9891d1150f47f72 # v2

      - uses: r-lib/actions/setup-r@2e3959d284a9ed60162f28a0f9891d1150f47f72 # v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@2e3959d284a9ed60162f28a0f9891d1150f47f72 # v2
        with:
          cache-version: 1
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@2e3959d284a9ed60162f28a0f9891d1150f47f72 # v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'

      # POST-CHECK QA (lintr / covr / goodpractice / pkgcheck) was
      # folded INTO this cell in 3MMM.62; reverted in 3MMM.72 -- it
      # added +40 min of sequential duplicate work (covr re-runs all
      # tests instrumented; goodpractice re-runs R CMD check). Those
      # checks now live as separate jobs in r-coverage-and-lint.yml
      # (lintr + covr parallel on every push; goodpractice + pkgcheck
      # workflow_dispatch only).
