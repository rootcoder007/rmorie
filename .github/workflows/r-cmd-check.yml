# SPDX-License-Identifier: AGPL-3.0-or-later
#
# r-cmd-check.yml -- consolidated R CMD check + lint/covr/goodpractice.
#
# Refactor 3MMM.62 + 3MMM.64 (2026-05-25): folds the previously-standalone
# r-lint, r-coverage, and r-goodpractice workflows into POST-CHECK steps
# on the ubuntu-latest + release cell so they share the installed R
# library and built package state. Saves ~3 redundant install+compile
# passes per build.
#
# r-pkgcheck.yml stays separate -- pkgcheck/pkgstats are GitHub-only
# (ropensci-review-tools/*), need universal-ctags system dep, and run
# their own LaTeX PDF build. Embedding here triggered pak dependency-
# resolution failures (3MMM.64); leaving it as a workflow_call leaf
# under build.yml is cheaper than the workarounds.
#
# Topology:
#   matrix R-CMD-check (5 cells: mac/win/ubuntu-{release,devel,oldrel-1})
#     |-- check-r-package (all cells)
#     |-- (ubuntu-release only) lintr + covr + goodpractice
#     |-- (ubuntu-release only) codecov upload
#
# Standalone r-lint.yml / r-coverage.yml / r-goodpractice.yml are
# retained as workflow_dispatch-only for manual debugging.
name: R CMD check

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Parallel compile for source-installed Suggests (C++ heavy deps).
  MAKEFLAGS: "-j4"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-latest,   r: 'release' }
          - { os: windows-2025,   r: 'release' }
          - { os: ubuntu-latest,  r: 'release' }
          - { os: ubuntu-latest,  r: 'devel'   }
          - { os: ubuntu-latest,  r: 'oldrel-1' }

    env:
      _R_CHECK_FORCE_SUGGESTS_: false
      R_KEEP_PKG_SOURCE: yes
      # Whether this cell runs the post-check quality steps
      # (lintr, covr, goodpractice). Only the primary ubuntu-release
      # cell pays that cost.
      RMORIE_RUN_QA: ${{ matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release' }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: r-lib/actions/setup-pandoc@2e3959d284a9ed60162f28a0f9891d1150f47f72 # v2

      - uses: r-lib/actions/setup-r@2e3959d284a9ed60162f28a0f9891d1150f47f72 # v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # cache-version: 1 -- pak's binary cache persists across runs +
      # leaves IF this key matches. Bump to invalidate (e.g. on Rcpp
      # toolchain change).
      #
      # Use the YAML literal-block (|) form so each package is on its
      # own line. The folded-scalar (>-) form collapses everything to
      # one space-separated string which pak then mis-resolves.
      - uses: r-lib/actions/setup-r-dependencies@2e3959d284a9ed60162f28a0f9891d1150f47f72 # v2
        with:
          cache-version: 1
          extra-packages: |
            any::rcmdcheck
            any::lintr
            any::covr
            any::xml2
            any::goodpractice
            any::cyclocomp
          needs: check

      # On Windows runners, actions/checkout sometimes drops the
      # 100755 index bit when materialising the tree to disk. R CMD
      # build then emits "file '...' did not have execute permissions:
      # corrected" warnings. Re-apply +x explicitly so the warning
      # never fires; no-op on Linux/Mac (already 0755 from checkout).
      - name: Ensure configure scripts are executable (Windows fix)
        if: matrix.config.os == 'windows-2025'
        shell: bash
        run: |
          chmod +x configure cleanup configure.win 2>/dev/null || true

      - uses: r-lib/actions/check-r-package@2e3959d284a9ed60162f28a0f9891d1150f47f72 # v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'

      # --- POST-CHECK QA steps (ubuntu-release only) -------------------
      # These previously ran as separate workflows that each re-installed
      # R + every Suggests from scratch. Folded in here so they reuse
      # the already-installed library state. Each step is independently
      # failure-tolerant (continue-on-error) so a single QA hiccup
      # doesn't fail the whole r-cmd-check leaf.

      - name: Run lintr
        if: env.RMORIE_RUN_QA == 'true'
        continue-on-error: true
        run: Rscript -e 'lintr::lint_package()'

      - name: Run covr + cobertura
        if: env.RMORIE_RUN_QA == 'true'
        continue-on-error: true
        run: |
          Rscript -e 'cov <- covr::package_coverage(type = "tests", quiet = TRUE); covr::to_cobertura(cov, filename = "coverage.xml"); cat(sprintf("Coverage: %.2f%%\n", covr::percent_coverage(cov)))'

      - name: Upload coverage to Codecov
        if: env.RMORIE_RUN_QA == 'true'
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml

      - name: Run goodpractice
        if: env.RMORIE_RUN_QA == 'true'
        continue-on-error: true
        run: Rscript -e 'g <- goodpractice::gp("."); print(g)'
