# SPDX-License-Identifier: AGPL-3.0-or-later
#
# r-cmd-check.yml -- consolidated R CMD check + lint/covr/goodpractice.
#
# Refactor 3MMM.62 + 3MMM.64 (2026-05-25): folds the previously-standalone
# r-lint, r-coverage, and r-goodpractice workflows into POST-CHECK steps
# on the ubuntu-latest + release cell so they share the installed R
# library and built package state. Saves ~3 redundant install+compile
# passes per build.
#
# r-pkgcheck.yml stays separate -- pkgcheck/pkgstats are GitHub-only
# (ropensci-review-tools/*), need universal-ctags system dep, and run
# their own LaTeX PDF build. Embedding here triggered pak dependency-
# resolution failures (3MMM.64); leaving it as a workflow_call leaf
# under build.yml is cheaper than the workarounds.
#
# Topology:
#   matrix R-CMD-check (5 cells: mac/win/ubuntu-{release,devel,oldrel-1})
#     |-- check-r-package (all cells)
#     |-- (ubuntu-release only) lintr + covr + goodpractice
#     |-- (ubuntu-release only) codecov upload
#
# Standalone r-lint.yml / r-coverage.yml / r-goodpractice.yml are
# retained as workflow_dispatch-only for manual debugging.
name: R CMD check

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Parallel compile for source-installed Suggests (C++ heavy deps).
  MAKEFLAGS: "-j4"
  # rgl is pulled transitively by car/caret/effects/emmeans (Suggests).
  # On macOS-ARM64 the CRAN rgl binary tries to dlopen libGLU.1.dylib at
  # .onLoad; XQuartz is not preinstalled on the runner -> segfault during
  # `checking dependencies in R code`, which crashes the whole check.
  # RGL_USE_NULL=TRUE makes rgl initialise in headless / null-device
  # mode and skip the OpenGL load entirely. Much cheaper than the
  # alternative (`brew install --cask xquartz`, ~150 MB, ~3 min). Set
  # on all OS cells: rgl is a CI-only transitive dep, no graphics tests
  # run here.
  RGL_USE_NULL: "TRUE"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    # R-devel is a moving target. Its current snapshot defaults to -std=gnu++20 and
    # systemically breaks source builds of upstream deps (RSQLite's vendored Boost,
    # ECOSolveR, ...) that have nothing to do with rmorie. There is no package-side
    # fix (CXX_STD in ~/.R/Makevars does NOT override R's default standard, verified
    # 2026-06-25). So the devel cell reports its status without failing the build;
    # all other cells stay strictly required.
    continue-on-error: ${{ matrix.config.allow_failure || false }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-latest,   r: 'release' }
          - { os: windows-latest, r: 'release' }
          - { os: ubuntu-latest,  r: 'release' }
          - { os: ubuntu-latest,  r: 'devel', allow_failure: true }
          # Pin oldrel to jammy (22.04): Posit Package Manager ships mature
          # binary packages for oldrel on 22.04, avoiding the ~40-min from-source
          # dependency builds seen on ubuntu-latest (24.04), where P3M lacks
          # oldrel binaries for newer package versions.
          - { os: ubuntu-22.04,   r: 'oldrel-1' }

    env:
      _R_CHECK_FORCE_SUGGESTS_: false
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Static guard -- every morie_* call must be defined
        run: Rscript scripts/audit/check_r_undefined.R .

      # The 2026-07-15 oldrel-1 failure was ENOSPC: a dep-cache miss (any
      # DESCRIPTION change reshuffles the lockfile hash) forces from-source
      # rebuilds whose /tmp intermediates fill the ~21 GB free on stock
      # runners. Dropping the unused preinstalled toolchains frees ~30 GB.
      - name: Free runner disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - uses: r-lib/actions/setup-pandoc@b7484da46de19a964f8831f505d2fcf84d1663ec # v2

      - uses: r-lib/actions/setup-r@b7484da46de19a964f8831f505d2fcf84d1663ec # v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          extra-repositories: |
            https://rootcoder007.r-universe.dev
            https://stan-dev.r-universe.dev

      # pak's worker processes run vanilla R and never read any Rprofile, so
      # repos set there (including use-public-rspm's) are invisible to it --
      # it fell back to cran.rstudio.com SOURCE and compiled 118 deps until
      # the job timed out. PKG_CRAN_MIRROR is pak's own env knob and env
      # survives vanilla subprocesses.
      #
      # The mirror has to differ by platform, because P3M's binary coverage
      # does:
      #
      #   Linux   -- P3M ($RSPM) serves the distro binaries we want. Keep it.
      #   Windows -- P3M has NO Windows binaries for the Stan stack. Asking
      #              it for rstanarm yields only src/contrib, so pak downloads
      #              the tarball and compiles Stan for ~13 min, then fails to
      #              load the freshly built DLL out of pak's temp verification
      #              library:
      #                unable to load shared object '.../rstanarm/libs/x64/rstanarm.dll'
      #              CRAN itself ships rstanarm_2.32.2.zip for R 4.5/4.6/4.7,
      #              so point Windows at CRAN and the binary is used directly:
      #              no compile, no DLL load failure, full Stan coverage kept.
      #              Verified 2026-07-25:
      #                P3M   /bin/windows/contrib/4.5/rstanarm_2.32.2.zip -> 404
      #                CRAN  /bin/windows/contrib/4.5/rstanarm_2.32.2.zip -> 200
      #   macOS   -- left on pak's default, which already resolves binaries.
      - name: Point pak at a mirror that has binaries for this platform
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "PKG_CRAN_MIRROR=https://cloud.r-project.org" >> "$GITHUB_ENV"
            echo "pak CRAN mirror -> https://cloud.r-project.org (Windows binaries)"
          elif [ -n "${RSPM:-}" ]; then
            echo "PKG_CRAN_MIRROR=${RSPM}" >> "$GITHUB_ENV"
            echo "pak CRAN mirror -> ${RSPM}"
          fi

      - name: System libraries for the bricklayer C++ core (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev
      - name: Pre-install rmoriebricklayer (r-universe; not yet on CRAN)
        run: install.packages(c("rmoriebricklayer", "rmoriedata"), repos = c("https://rootcoder007.r-universe.dev", "https://cloud.r-project.org"))
        shell: Rscript {0}

      # rmoriebricklayer ships a compiled libcurl fetch core; on a cold
      # cache (or an R version r-universe has no binary for yet) it builds
      # from source, which needs the libcurl headers.
      - uses: r-lib/actions/setup-r-dependencies@b7484da46de19a964f8831f505d2fcf84d1663ec # v2
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          # ECOSolveR (via HonestDiD) vendors a SuiteSparse/AMD Makefile that
          # races under parallel make whenever the dep cache misses; build the
          # dependency tree serially (same as r-coverage.yml). rmorie's own
          # compile in check-r-package keeps the workflow-level -j4.
          MAKEFLAGS: "-j1"
        with:
          cache-version: 2
          # rgenoud is a runtime Depends of Matching/rbounds (used by the
          # genetic-matching + Rosenbaum-bounds wrappers) that is not pulled
          # in transitively here; request it explicitly so Matching::GenMatch
          # / rbounds::psens don't crash with "no package called 'rgenoud'".
          extra-packages: any::rcmdcheck any::rgenoud github::rootcoder007/rmorie-bricklayer github::rootcoder007/rmoriedata github::stan-dev/cmdstanr
          needs: check

      - name: Reinstall rmoriebricklayer (overwrite any cache-restored 0.2.0)
        run: install.packages(c("rmoriebricklayer", "rmoriedata"), repos = "https://rootcoder007.r-universe.dev")
        shell: Rscript {0}

      # Belt-and-suspenders: pak resolves Suggests, but anything its solver
      # skipped (platform quirks, new entries) is installed here so the full
      # test suite genuinely runs on this leaf.
      - name: Install any missing Suggests
        shell: Rscript {0}
        run: |
          options(repos = c(runiverse = "https://rootcoder007.r-universe.dev",
                            CRAN = "https://cloud.r-project.org"))
          desc <- read.dcf("DESCRIPTION")
          sug <- desc[1, "Suggests"]
          pkgs <- character(0)
          if (!is.na(sug) && nzchar(sug)) {
            sug <- gsub("\\s*\\([^)]*\\)", "", sug)
            pkgs <- trimws(strsplit(sug, ",")[[1]])
            pkgs <- pkgs[nzchar(pkgs)]
          }
          missing <- pkgs[!pkgs %in% rownames(installed.packages())]
          # cmdstanr lives on stan-dev r-universe / github, handled above.
          missing <- setdiff(missing, "cmdstanr")
          if (length(missing)) {
            message("Installing Suggests: ", paste(missing, collapse = ", "))
            install.packages(missing)
          }

      # Exercise the true cmdstanr backend (github.com/stan-dev/cmdstan) on
      # ONE leaf only -- a full CmdStan toolchain build is ~10 min uncached,
      # so the other leaves cover the brms rstan-fallback path instead.
      - name: Cache CmdStan (ubuntu release leaf only)
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-2.39.0

      - name: Install CmdStan (ubuntu release leaf only)
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (is.null(cmdstanr::cmdstan_version(error_on_NA = FALSE))) {
            cmdstanr::check_cmdstan_toolchain(fix = TRUE)
            # Pinned: querying releases/latest unauthenticated gets rate-limited
            # on shared runners (main-branch cache misses hit this; PR caches are
            # branch-scoped and invisible to main).
            cmdstanr::install_cmdstan(cores = 2, version = "2.39.0")
          }
          cat("CmdStan:", cmdstanr::cmdstan_version(), "\n")
        shell: Rscript {0}
      # Mirror morie's CI shape: drop --as-cran from per-push (51min+ on
      # rmorie Linux due to --as-cran URL-probing + 112 source-installed
      # Suggests). Plain check on per-push; --as-cran gated to
      # release/** branches and workflow_dispatch. Same trade-off morie
      # made: "Drop --as-cran (too strict pre-CRAN); re-enable for the
      # CRAN-submission PR."
      - name: Resolve check args (--as-cran on release/dispatch only)
        id: check_args
        run: |
          if [[ "${{ github.ref }}" == refs/heads/release/* ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "args=c(\"--no-manual\", \"--as-cran\")" >> "$GITHUB_OUTPUT"
          else
            echo "args=c(\"--no-manual\")" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - uses: r-lib/actions/check-r-package@b7484da46de19a964f8831f505d2fcf84d1663ec # v2
        with:
          upload-snapshots: true
          args: ${{ steps.check_args.outputs.args }}
          error-on: '"error"'

      # POST-CHECK QA (lintr / covr / goodpractice / pkgcheck) was
      # folded INTO this cell in 3MMM.62; reverted in 3MMM.72 -- it
      # added +40 min of sequential duplicate work (covr re-runs all
      # tests instrumented; goodpractice re-runs R CMD check). Those
      # checks now live as separate jobs in r-coverage-and-lint.yml
      # (lintr + covr parallel on every push; goodpractice + pkgcheck
      # workflow_dispatch only).

  # Debian R CMD check leg. The five matrix cells above never touch
  # Debian, and CRAN's own farm runs it; true Debian bookworm.
  # Hard-deps flavour (Suggests absent -> their tests/examples skip,
  # _R_CHECK_FORCE_SUGGESTS_=false; vignettes need Suggests, ignored).
  R-CMD-check-debian:
    name: debian-bookworm (r-base 4.5.1, Debian)
    runs-on: ubuntu-latest
    container: r-base:4.5.1
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Debian toolchain
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq build-essential libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Install hard dependencies + rcmdcheck
        run: |
          options(HTTPUserAgent = sprintf(
            "R/%s R (%s)", getRversion(),
            paste(getRversion(), R.version["platform"],
                  R.version["arch"], R.version["os"])))
          repos <- c(
            runiverse = "https://rootcoder007.r-universe.dev",
            P3M = "https://packagemanager.posit.co/cran/__linux__/bookworm/latest",
            CRAN = "https://cloud.r-project.org")
          pkgs <- c("here", "Rcpp", "RcppArmadillo",
                    "rmoriebricklayer", "rmoriedata", "testthat", "rcmdcheck")
          install.packages(pkgs, repos = repos, Ncpus = 2)
          missing <- setdiff(pkgs, rownames(installed.packages()))
          if (length(missing) > 0) stop("failed to install: ",
                                        paste(missing, collapse = ", "))
        shell: Rscript {0}
      - name: R CMD check (as-cran, no vignettes) on Debian
        run: |
          res <- rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran", "--ignore-vignettes"),
            build_args = c("--no-build-vignettes", "--no-manual"),
            error_on = "error")
          print(res)
        shell: Rscript {0}
      - name: Upload check logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian-check-logs
          path: |
            check/*.Rcheck/00check.log
            check/*.Rcheck/tests/
          if-no-files-found: ignore
