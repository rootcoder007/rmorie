# Keeps the main-branch dependency caches warm. GitHub evicts caches unused
# for 7 days (and LRU past 10GB); a cold main cache is what turned pkgdown
# runs into 80-140 minute serial rebuilds. A daily restore marks every dep
# cache as used, so main runs stay in the ~2-minute restore path.
name: r-cache-warmer

on:
  schedule:
    - cron: "17 09 * * *" # daily, off-peak
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # first run after an eviction legitimately rebuilds
    env:
      MAKEFLAGS: "-j1" # ECOSolveR SuiteSparse Makefile races under parallel make
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: r-lib/actions/setup-r@b7484da46de19a964f8831f505d2fcf84d1663ec # v2
        with:
          r-version: 'release'
          use-public-rspm: true
          extra-repositories: |
            https://rootcoder007.r-universe.dev
            https://stan-dev.r-universe.dev

      # setup-r exports RSPM but pak still resolved CRAN to cran.rstudio.com
      # (R's "@CRAN@" default), so the P3M binary mirror was never used and
      # 118 packages -- Stan included -- compiled from source, pushing this
      # job past 45 min. Pin CRAN to the binary mirror and print the result
      # so any regression is visible in the log. RSPM is only set on Linux,
      # so the macOS/Windows legs fall through unchanged.
      - name: Pin CRAN to the P3M binary mirror
        shell: bash
        run: |
          if [ -n "${RSPM:-}" ]; then
            printf 'options(repos = c(CRAN = "%s"%s))\n' \
              "${RSPM}" \
              ', rootcoder = "https://rootcoder007.r-universe.dev", stan = "https://stan-dev.r-universe.dev"' \
              >> ~/.Rprofile
          fi
          Rscript -e 'print(getOption("repos"))'

      # rmoriebricklayer ships a compiled libcurl fetch core and is pulled from
      # GitHub source here, so the headers must exist before it builds.
      - name: System libraries for the bricklayer C++ core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev libssl-dev libxml2-dev

      - uses: r-lib/actions/setup-r-dependencies@b7484da46de19a964f8831f505d2fcf84d1663ec # v2
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          cache-version: 2
          extra-packages: any::rcmdcheck any::rgenoud any::pkgdown github::rootcoder007/rmorie-bricklayer github::rootcoder007/rmoriedata github::stan-dev/cmdstanr
          needs: check, website
