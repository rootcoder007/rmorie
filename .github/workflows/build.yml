# SPDX-License-Identifier: AGPL-3.0-or-later
#
# build.yml -- fan-out/fan-in DAG orchestrator for rmorie CI.
#
# The DAG fans OUT from `setup` into every leaf in parallel (no
# inter-leaf dependencies), then fans IN to a single `summary` node
# that fails if any leaf failed. This minimises wall-clock time:
# coverage no longer waits for r-cmd-check to finish.
#
# Topology:
#
#                       +-> r-cmd-check (matrix: 5 cells)         -+
#                       |                                          |
#                       +-> r-coverage (covr + codecov)            -+
#                       |                                          |
#                       +-> r-lint (lintr::lint_package)           -+
#                       |                                          |
#   setup ------------> +-> r-goodpractice (cyclocomp + rcmdcheck) -+-> summary
#                       |                                          |
#                       +-> r-pkgcheck (rOpenSci)                  -+
#                       |                                          |
#                       +-> codeql (actions + c-cpp)               -+
#
# Each leaf is workflow_call into its own reusable file. Failure of
# any single leaf fails `summary`, which is the one required check
# for branch-protection on `main`.

name: build

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]
  workflow_dispatch:

# Permissions union of every leaf workflow's needs.
permissions:
  contents: read
  security-events: write   # codeql SARIF upload
  actions: read            # codeql 'actions' language
  packages: read           # codeql pulls query packs from ghcr

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Read DESCRIPTION version
        id: meta
        run: |
          v=$(grep '^Version:' DESCRIPTION | awk '{print $2}')
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Report
        run: |
          echo "rmorie version: ${{ steps.meta.outputs.version }}"
          echo "ref:            ${{ github.ref }}"
          echo "sha:            ${{ github.sha }}"

  # ---- Fan-out: every leaf depends ONLY on `setup` ----

  r-cmd-check:
    needs: setup
    uses: ./.github/workflows/r-cmd-check.yml
    secrets: inherit

  r-coverage:
    needs: setup
    uses: ./.github/workflows/r-coverage.yml
    secrets: inherit

  r-lint:
    needs: setup
    uses: ./.github/workflows/r-lint.yml
    secrets: inherit

  r-goodpractice:
    needs: setup
    uses: ./.github/workflows/r-goodpractice.yml
    secrets: inherit

  r-pkgcheck:
    needs: setup
    uses: ./.github/workflows/r-pkgcheck.yml
    secrets: inherit

  codeql:
    needs: setup
    uses: ./.github/workflows/codeql.yml
    secrets: inherit

  # ---- Fan-in: single required check ----

  summary:
    name: summary
    needs:
      - setup
      - r-cmd-check
      - r-coverage
      - r-lint
      - r-goodpractice
      - r-pkgcheck
      - codeql
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tabulate per-leaf results
        run: |
          set -eu
          echo "Per-leaf result table:"
          echo "  setup          = ${{ needs.setup.result }}"
          echo "  r-cmd-check    = ${{ needs.r-cmd-check.result }}"
          echo "  r-coverage     = ${{ needs.r-coverage.result }}"
          echo "  r-lint         = ${{ needs.r-lint.result }}"
          echo "  r-goodpractice = ${{ needs.r-goodpractice.result }}"
          echo "  r-pkgcheck     = ${{ needs.r-pkgcheck.result }}"
          echo "  codeql         = ${{ needs.codeql.result }}"
      - name: Fail if any leaf failed
        run: |
          set -eu
          fail=0
          for r in \
            "${{ needs.setup.result }}" \
            "${{ needs.r-cmd-check.result }}" \
            "${{ needs.r-coverage.result }}" \
            "${{ needs.r-lint.result }}" \
            "${{ needs.r-goodpractice.result }}" \
            "${{ needs.r-pkgcheck.result }}" \
            "${{ needs.codeql.result }}"; do
            if [ "$r" != "success" ]; then
              fail=1
            fi
          done
          if [ "$fail" -eq 1 ]; then
            echo "::error::At least one CI leaf failed/cancelled -- see the table above."
            exit 1
          fi
          echo "All CI leaves green."
