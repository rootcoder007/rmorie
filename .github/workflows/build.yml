# SPDX-License-Identifier: AGPL-3.0-or-later
#
# build.yml -- fan-out/fan-in DAG orchestrator for rmorie CI.
#
# The DAG fans OUT from `setup` into every quality leaf in parallel,
# then GATES the container build behind ALL quality leaves passing,
# then fans IN to a single `summary` node.
#
# Topology (3MMM.72 revert, 2026-05-25):
#
#                       +-> r-cmd-check (matrix: 5 cells)     -+
#                       +-> r-coverage (covr + codecov)       -+
#                       +-> r-lint (lintr)                    -+
#   setup ------------> +-> codeql (actions + c-cpp)          -+-> docker-publish -+
#                       +-> pkgdown (build + deploy Pages)    -+    (gated)        |
#                                                                                  v
#                                                                              summary
#
# r-pkgcheck and r-goodpractice removed from auto-fire fan-out in
# 3MMM.72 -- both re-run R CMD check + covr + cyclocomp + lintr
# internally (~1 hour per push each). They remain available via
# workflow_dispatch from the Actions tab for pre-rOpenSci-submission
# audits, not on every push.
#
# docker-publish ONLY runs when every quality leaf is green. If any
# fails, the container leaf is skipped and a broken image cannot be
# published. The push step inside docker-publish itself only fires
# when the workflow is invoked for a release (tag push, manual
# dispatch) -- branch pushes build the image but do not push to GHCR.

name: build

on:
  push:
    branches: ["main", "release/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "release/**"]
  workflow_dispatch:
    inputs:
      publish_container:
        description: "Publish container to GHCR after green CI"
        type: boolean
        default: false

# Permissions union of every leaf workflow's needs.
permissions:
  contents: read
  security-events: write   # codeql SARIF upload
  actions: read            # codeql 'actions' language
  packages: write          # docker-publish pushes to ghcr.io
  pages: write             # pkgdown deploys to GitHub Pages
  id-token: write          # pkgdown OIDC for actions/deploy-pages

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      should_publish: ${{ steps.gate.outputs.should_publish }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Read DESCRIPTION version
        id: meta
        run: |
          v=$(grep '^Version:' DESCRIPTION | awk '{print $2}')
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Decide whether to publish container
        id: gate
        run: |
          # Publish when:
          #   - tag push (v*.*.*) — release
          #   - workflow_dispatch with publish_container=true — manual
          # Otherwise build the image to verify, but don't push.
          if [[ "${{ github.ref }}" == refs/tags/v* ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" && \
                "${{ github.event.inputs.publish_container }}" == "true" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report
        run: |
          echo "rmorie version:   ${{ steps.meta.outputs.version }}"
          echo "ref:              ${{ github.ref }}"
          echo "sha:              ${{ github.sha }}"
          echo "should_publish:   ${{ steps.gate.outputs.should_publish }}"

  # ---- Fan-out: 4 leaves (was 7) ----
  #
  # Refactor 3MMM.62 + 3MMM.64: r-cmd-check now ALSO runs lintr / covr /
  # goodpractice as post-check steps on its ubuntu-release matrix cell,
  # so they share the just-installed R library and built package state.
  # The previously-separate r-lint / r-coverage / r-goodpractice
  # workflows are retained as workflow_dispatch-only for manual debug.
  #
  # r-pkgcheck stays a separate leaf -- pkgcheck/pkgstats are GitHub-
  # only (ropensci-review-tools/*), need universal-ctags system dep,
  # and pull in their own LaTeX PDF build. Embedding broke pak
  # dependency resolution on first try (3MMM.62 -> 3MMM.64).

  r-cmd-check:
    needs: setup
    uses: ./.github/workflows/r-cmd-check.yml
    secrets: inherit

  # covr + lint run in parallel with r-cmd-check (small jobs, ~5-15 min
  # each). Previously folded into r-cmd-check post-check steps (3MMM.62)
  # which serialized them after the check; reverted 3MMM.72 because the
  # consolidation added 40+ min instead of saving time.
  r-coverage:
    needs: setup
    uses: ./.github/workflows/r-coverage.yml
    secrets: inherit

  r-lint:
    needs: setup
    uses: ./.github/workflows/r-lint.yml
    secrets: inherit

  # r-pkgcheck and r-goodpractice are workflow_dispatch-only since
  # 3MMM.72 -- both re-run R CMD check + covr + cyclocomp + lintr
  # internally (~1 hour per push each). Fire manually from the
  # Actions tab before rOpenSci submission.

  codeql:
    needs: setup
    uses: ./.github/workflows/codeql.yml
    secrets: inherit

  pkgdown:
    needs: setup
    uses: ./.github/workflows/pkgdown.yml
    secrets: inherit

  # ---- Quality gate: docker only after every quality leaf is green ----

  docker-publish:
    needs:
      - setup
      - r-cmd-check
      - r-coverage
      - r-lint
      - codeql
    # Only run when every upstream leaf succeeded. GitHub's default
    # behaviour skips on upstream failure; we make that explicit.
    if: ${{ success() }}
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit
    with:
      push: ${{ needs.setup.outputs.should_publish == 'true' }}

  # ---- Fan-in: single required check ----

  # Trigger r-universe rebuild ONLY when:
  #   - this is a push (not a PR) to main, AND
  #   - all upstream quality leaves succeeded.
  # Mechanism: push an empty commit to the registry repo
  # (rootcoder007.r-universe.dev); GitHub's push webhook fires, which
  # r-universe.dev's backend is subscribed to, which triggers the pull
  # + nightly-style build of all packages in packages.json.
  #
  # Requires: a secret R_UNIVERSE_TRIGGER_PAT with `contents: write`
  # scope on rootcoder007/rootcoder007.r-universe.dev. continue-on-error
  # so a missing/expired PAT never blocks the rest of CI.
  r-universe-sync:
    needs:
      - setup
      - r-cmd-check
      - r-coverage
      - r-lint
      - codeql
      - pkgdown
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      success()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Push empty commit to registry repo
        env:
          R_UNIVERSE_TRIGGER_PAT: ${{ secrets.R_UNIVERSE_TRIGGER_PAT }}
        run: |
          if [ -z "$R_UNIVERSE_TRIGGER_PAT" ]; then
            echo "::warning::R_UNIVERSE_TRIGGER_PAT not set; skipping r-universe sync."
            exit 0
          fi
          tmp=$(mktemp -d)
          git clone --depth=1 \
            "https://x-access-token:${R_UNIVERSE_TRIGGER_PAT}@github.com/rootcoder007/rootcoder007.r-universe.dev" \
            "$tmp"
          cd "$tmp"
          git config user.email "noreply@anthropic.com"
          git config user.name "rmorie CI"
          git commit --allow-empty -m "sync: rmorie ${{ github.sha }}"
          git push

  summary:
    name: summary
    needs:
      - setup
      - r-cmd-check
      - r-coverage
      - r-lint
      - codeql
      - pkgdown
      - docker-publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tabulate per-leaf results
        run: |
          set -eu
          echo "Per-leaf result table:"
          echo "  setup            = ${{ needs.setup.result }}"
          echo "  r-cmd-check      = ${{ needs.r-cmd-check.result }}"
          echo "  r-coverage       = ${{ needs.r-coverage.result }}"
          echo "  r-lint           = ${{ needs.r-lint.result }}"
          echo "  codeql           = ${{ needs.codeql.result }}"
          echo "  pkgdown          = ${{ needs.pkgdown.result }}"
          echo "  docker-publish   = ${{ needs.docker-publish.result }}"
      - name: Fail if any leaf failed
        run: |
          set -eu
          fail=0
          # docker-publish is allowed to be 'skipped' when a quality
          # leaf failed -- that's the gating behaviour. But any other
          # leaf being non-success fails the summary.
          for r in \
            "${{ needs.setup.result }}" \
            "${{ needs.r-cmd-check.result }}" \
            "${{ needs.r-coverage.result }}" \
            "${{ needs.r-lint.result }}" \
            "${{ needs.codeql.result }}" \
            "${{ needs.pkgdown.result }}"; do
            if [ "$r" != "success" ]; then
              fail=1
            fi
          done
          # docker-publish: success or skipped is OK; failure is not.
          if [ "${{ needs.docker-publish.result }}" = "failure" ] || \
             [ "${{ needs.docker-publish.result }}" = "cancelled" ]; then
            fail=1
          fi
          if [ "$fail" -eq 1 ]; then
            echo "::error::At least one CI leaf failed -- see the table above."
            exit 1
          fi
          echo "All CI leaves green."
