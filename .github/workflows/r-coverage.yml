#
# r-coverage.yml -- covr + codecov.io upload.
# Called via build.yml (workflow_call) or manually (workflow_dispatch).

name: R coverage

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MAKEFLAGS: "-j4"

permissions:
  contents: read

jobs:
  coverage:
    name: covr + codecov
    runs-on: ubuntu-latest

    env:
      _R_CHECK_FORCE_SUGGESTS_: false
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: r-lib/actions/setup-r@2e3959d284a9ed60162f28a0f9891d1150f47f72 # v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@2e3959d284a9ed60162f28a0f9891d1150f47f72 # v2
        with:
          extra-packages: any::covr any::xml2
          needs: coverage

      - name: Run covr
        # quiet=FALSE so the failing test name shows up in the CI log
        # (the previous run silently halted at "testthat.Rout.fail").
        # If covr still dies, the next step dumps every .Rout.fail
        # under /tmp so the actual testthat output is recoverable.
        run: |
          Rscript -e 'cov <- covr::package_coverage(type = "tests", quiet = FALSE); covr::to_cobertura(cov, filename = "coverage.xml"); cat(sprintf("Coverage: %.2f%%\n", covr::percent_coverage(cov)))'

      - name: Dump testthat.Rout.fail on failure
        if: failure()
        run: |
          echo "=== searching /tmp for testthat.Rout.fail ==="
          find /tmp -name 'testthat.Rout.fail' -print 2>/dev/null | while read -r f; do
            echo ""
            echo "===== $f ====="
            tail -200 "$f"
          done
          echo ""
          echo "=== also dumping any rmorie-Ex.Rout.fail ==="
          find /tmp -name '*.Rout.fail' -print 2>/dev/null | while read -r f; do
            echo ""
            echo "===== $f ====="
            tail -200 "$f"
          done

      - name: Upload .Rout.fail as artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rmorie-covr-rout-fail
          path: /tmp/**/*.Rout.fail
          if-no-files-found: ignore
          retention-days: 7

      # Codecov v5 on public repos uses tokenless upload via OIDC; no
      # CODECOV_TOKEN secret needed.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: r-tests
          fail_ci_if_error: false
          slug: rootcoder007/rmorie
        continue-on-error: true
