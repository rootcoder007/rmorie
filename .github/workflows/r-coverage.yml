#
# r-coverage.yml -- covr + codecov.io upload.
# Called via build.yml (workflow_call) or manually (workflow_dispatch).

name: R coverage

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MAKEFLAGS: "-j4"

permissions:
  contents: read

jobs:
  coverage:
    name: covr + codecov
    runs-on: ubuntu-latest

    env:
      _R_CHECK_FORCE_SUGGESTS_: false
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: r-lib/actions/setup-r@b7484da46de19a964f8831f505d2fcf84d1663ec # v2
        with:
          r-version: 'release'
          use-public-rspm: true
          extra-repositories: |
            https://rootcoder007.r-universe.dev
            https://stan-dev.r-universe.dev

      # setup-r exports RSPM but pak still resolved CRAN to cran.rstudio.com
      # (R's "@CRAN@" default), so the P3M binary mirror was never used and
      # 118 packages -- Stan included -- compiled from source, pushing this
      # job past 45 min. Pin CRAN to the binary mirror and print the result
      # so any regression is visible in the log. RSPM is only set on Linux,
      # so the macOS/Windows legs fall through unchanged.
      - name: Pin CRAN to the P3M binary mirror
        shell: bash
        run: |
          if [ -n "${RSPM:-}" ]; then
            printf 'options(repos = c(CRAN = "%s"%s))\n' \
              "${RSPM}" \
              ', rootcoder = "https://rootcoder007.r-universe.dev", stan = "https://stan-dev.r-universe.dev"' \
              >> ~/.Rprofile
          fi
          Rscript -e 'print(getOption("repos"))'

      # rmoriebricklayer ships a compiled libcurl fetch core and is pulled from
      # GitHub source here, so the headers must exist before it builds.
      - name: System libraries for the bricklayer C++ core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Pre-install rmoriebricklayer (r-universe; not yet on CRAN)
        run: install.packages("rmoriebricklayer", repos = c("https://rootcoder007.r-universe.dev", "https://cloud.r-project.org"))
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@b7484da46de19a964f8831f505d2fcf84d1663ec # v2
        with:
          # rgenoud: runtime Depends of Matching/rbounds (Rosenbaum + genetic
          # matching tests); covr runs the full suite so it's needed here too.
          extra-packages: any::covr any::xml2 any::rgenoud github::rootcoder007/rmorie-bricklayer github::rootcoder007/rmoriedata github::stan-dev/cmdstanr
          needs: coverage
        env:
          # ECOSolveR (a healthy CRAN package by B. Narasimhan, pulled in via
          # HonestDiD -- https://cran.r-project.org/package=ECOSolveR) vendors a
          # SuiteSparse/AMD Makefile that can race under parallel make, so build
          # the dependency tree serially here, the same way CRAN builds it.
          # rmorie's own compile (the "Run covr" step below) keeps -j4.
          MAKEFLAGS: "-j1"
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Reinstall rmoriebricklayer (overwrite any cache-restored 0.2.0)
        run: install.packages("rmoriebricklayer", repos = "https://rootcoder007.r-universe.dev")
        shell: Rscript {0}
      - name: Run covr
        # quiet=FALSE so the failing test name shows up in the CI log
        # (the previous run silently halted at "testthat.Rout.fail").
        # If covr still dies, the next step dumps every .Rout.fail
        # under /tmp so the actual testthat output is recoverable.
        run: |
          Rscript -e 'cov <- covr::package_coverage(type = "tests", quiet = FALSE); covr::to_cobertura(cov, filename = "coverage.xml"); cat(sprintf("Coverage: %.2f%%\n", covr::percent_coverage(cov)))'

      - name: Dump testthat.Rout.fail on failure
        if: failure()
        run: |
          echo "=== searching /tmp for testthat.Rout.fail ==="
          find /tmp -name 'testthat.Rout.fail' -print 2>/dev/null | while read -r f; do
            echo ""
            echo "===== $f ====="
            tail -200 "$f"
          done
          echo ""
          echo "=== also dumping any rmorie-Ex.Rout.fail ==="
          find /tmp -name '*.Rout.fail' -print 2>/dev/null | while read -r f; do
            echo ""
            echo "===== $f ====="
            tail -200 "$f"
          done

      - name: Upload .Rout.fail as artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rmorie-covr-rout-fail
          path: /tmp/**/*.Rout.fail
          if-no-files-found: ignore
          retention-days: 7

      # Codecov v5 on public repos uses tokenless upload via OIDC; no
      # CODECOV_TOKEN secret needed.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: r-tests
          fail_ci_if_error: false
          slug: rootcoder007/rmorie
        continue-on-error: true
