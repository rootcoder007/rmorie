#
# docker-publish.yml -- reusable leaf in the build DAG.
#
# This workflow ONLY runs as a child of build.yml; it has no direct
# triggers of its own (no push, no PR, no tag, no cron). The build.yml
# orchestrator decides WHEN to publish:
#
#   - on every push to `main` or `release/**`: build only (push: false)
#   - on a `v*.*.*` tag push:                   build + push to GHCR
#   - on workflow_dispatch:                     build + push (manual)
#
# Critically, docker-publish is a LEAF of the build DAG that depends
# on every quality leaf (r-cmd-check, r-coverage, r-lint, r-goodpractice,
# r-pkgcheck, codeql). If ANY of those fail, this leaf is skipped --
# so a broken package can never publish a broken container.
#
# Image coordinates (when publishing):
#   ghcr.io/rootcoder007/rmorie:latest      (main + tag)
#   ghcr.io/rootcoder007/rmorie:0.9.5.12    (semver patch)
#   ghcr.io/rootcoder007/rmorie:0.9.5       (patch track)
#   ghcr.io/rootcoder007/rmorie:0.9         (minor track)
#   ghcr.io/rootcoder007/rmorie:sha-<7>     (every push)
#
# Multi-arch: linux/amd64 + linux/arm64.

name: Publish container

on:
  workflow_call:
    inputs:
      push:
        description: "Push to GHCR (true on tags/dispatch; false otherwise)"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      push:
        description: "Push to GHCR"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (multi-arch, retry against transient binfmt race)
        run: |
          for i in 1 2 3; do
            docker run --rm --privileged tonistiigi/binfmt:latest --install all && exit 0
            echo "::warning::binfmt install attempt $i failed (transient binfmt_misc race); retrying in 5s"
            sleep 5
          done
          echo "::error::binfmt install failed after 3 attempts"; exit 1
        shell: bash

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        # Only when actually publishing. PR builds (incl. Dependabot, which is
        # denied repo secrets by GitHub) build-only and must skip this login.
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/rmorie
            docker.io/${{ github.repository_owner }}/rmorie
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build (+ optionally push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # mode=min (final-stage layers only), NOT mode=max: max exported
          # every intermediate build layer (~1 GB of buildkit blobs) into the
          # shared 10 GB Actions cache, which evicted the ~1.65 GB R
          # dependency caches (LRU) and forced a full 144-package source
          # recompile (~2 h) on nearly every push. min keeps Docker layer
          # reuse without starving the R caches.
          cache-from: type=gha
          cache-to: type=gha,mode=min
