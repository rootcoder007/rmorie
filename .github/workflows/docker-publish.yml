#
# docker-publish.yml -- reusable leaf in the build DAG.
#
# This workflow ONLY runs as a child of build.yml; it has no direct
# triggers of its own (no push, no PR, no tag, no cron). The build.yml
# orchestrator decides WHEN to publish:
#
#   - on every push to `main` or `release/**`: build only (push: false)
#   - on a `v*.*.*` tag push:                   build + push to GHCR
#   - on workflow_dispatch:                     build + push (manual)
#
# Critically, docker-publish is a LEAF of the build DAG that depends
# on every quality leaf (r-cmd-check, r-coverage, r-lint, r-goodpractice,
# r-pkgcheck, codeql). If ANY of those fail, this leaf is skipped --
# so a broken package can never publish a broken container.
#
# Image coordinates (when publishing):
#   ghcr.io/rootcoder007/rmorie:latest      (main + tag)
#   ghcr.io/rootcoder007/rmorie:0.9.5.12    (semver patch)
#   ghcr.io/rootcoder007/rmorie:0.9.5       (patch track)
#   ghcr.io/rootcoder007/rmorie:0.9         (minor track)
#   ghcr.io/rootcoder007/rmorie:sha-<7>     (every push)
#
# Multi-arch: linux/amd64 + linux/arm64.

name: Publish container

on:
  workflow_call:
    inputs:
      push:
        description: "Push to GHCR (true on tags/dispatch; false otherwise)"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      push:
        description: "Push to GHCR"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU (multi-arch, retry against transient binfmt race)
        run: |
          for i in 1 2 3; do
            docker run --rm --privileged tonistiigi/binfmt:latest --install all && exit 0
            echo "::warning::binfmt install attempt $i failed (transient binfmt_misc race); retrying in 5s"
            sleep 5
          done
          echo "::error::binfmt install failed after 3 attempts"; exit 1
        shell: bash

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/rmorie
            docker.io/${{ github.repository_owner }}/rmorie
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build (+ optionally push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
