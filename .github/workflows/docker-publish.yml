# SPDX-License-Identifier: AGPL-3.0-or-later
#
# docker-publish.yml -- build + push the rmorie container to GHCR.
#
# Triggers:
#   * push of a `v*.*.*` tag           -> tagged immutable release
#   * manual workflow_dispatch         -> ad-hoc rebuild
#   * weekly cron                      -> refresh `latest` against new
#                                         base-image security patches
#
# After the FIRST successful run, the container becomes visible on
# the repo's "Packages" sidebar (replacing the "Release your first
# package" placeholder GitHub shows on empty-package repos).
#
# Image coordinates:
#   ghcr.io/rootcoder007/rmorie:latest
#   ghcr.io/rootcoder007/rmorie:0.9.5.12          (semver, no v prefix)
#   ghcr.io/rootcoder007/rmorie:0.9                (minor track)
#   ghcr.io/rootcoder007/rmorie:0.9.5              (patch track)
#
# Multi-arch: linux/amd64 + linux/arm64 so both x86 CI runners and
# Apple Silicon dev machines pull a native image.

name: Publish container

on:
  push:
    tags: ["v*.*.*"]
  schedule:
    - cron: "27 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # required to push to ghcr.io

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@7f9aaaffa50b7aa9d8d6f147ed9a1be21f255d98 # v4.0.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/rmorie
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build + push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
