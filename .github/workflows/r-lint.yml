#
# r-lint.yml -- lintr::lint_package().
# Called via build.yml (workflow_call) or manually (workflow_dispatch).

name: R lint

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  lint:
    name: lintr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: r-lib/actions/setup-r@b7484da46de19a964f8831f505d2fcf84d1663ec # v2
        with:
          r-version: 'release'
          use-public-rspm: true
          extra-repositories: |
            https://rootcoder007.r-universe.dev
            https://stan-dev.r-universe.dev

      # pak's worker processes run vanilla R and never read any Rprofile, so
      # repos set there (including use-public-rspm's) are invisible to it --
      # it fell back to cran.rstudio.com SOURCE and compiled 118 deps until
      # the job timed out. PKG_CRAN_MIRROR is pak's own env knob and env
      # survives vanilla subprocesses. RSPM is Linux-only, so other legs
      # are untouched.
      - name: Point pak at the P3M binary mirror
        shell: bash
        run: |
          if [ -n "${RSPM:-}" ]; then
            echo "PKG_CRAN_MIRROR=${RSPM}" >> "$GITHUB_ENV"
            echo "pak CRAN mirror -> ${RSPM}"
          fi

      # rmoriebricklayer ships a compiled libcurl fetch core and is pulled from
      # GitHub source here, so the headers must exist before it builds.
      - name: System libraries for the bricklayer C++ core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Pre-install rmoriebricklayer (r-universe; not yet on CRAN)
        run: install.packages("rmoriebricklayer", repos = c("https://rootcoder007.r-universe.dev", "https://cloud.r-project.org"))
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@b7484da46de19a964f8831f505d2fcf84d1663ec # v2
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra-packages: any::lintr github::rootcoder007/rmorie-bricklayer github::rootcoder007/rmoriedata github::stan-dev/cmdstanr
      - name: Run lintr
        run: Rscript -e 'lintr::lint_package()'
