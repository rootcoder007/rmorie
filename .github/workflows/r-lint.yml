#
# r-lint.yml -- lintr::lint_package().
# Called via build.yml (workflow_call) or manually (workflow_dispatch).

name: R lint

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  lint:
    name: lintr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: r-lib/actions/setup-r@2e3959d284a9ed60162f28a0f9891d1150f47f72 # v2
        with:
          r-version: 'release'
          use-public-rspm: true
          extra-repositories: |
            https://rootcoder007.r-universe.dev
            https://stan-dev.r-universe.dev
      - name: Pre-install rmoriebricklayer (r-universe; not yet on CRAN)
        run: install.packages("rmoriebricklayer", repos = c("https://rootcoder007.r-universe.dev", "https://cloud.r-project.org"))
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@2e3959d284a9ed60162f28a0f9891d1150f47f72 # v2
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra-packages: any::lintr github::rootcoder007/rmorie-bricklayer github::rootcoder007/rmoriedata github::stan-dev/cmdstanr
      - name: Run lintr
        run: Rscript -e 'lintr::lint_package()'
