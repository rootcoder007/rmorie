# SPDX-License-Identifier: AGPL-3.0-or-later
#
# pkgdown.yml -- build + deploy the rmorie pkgdown site to GitHub
# Pages at https://rootcoder007.github.io/rmorie/.
#
# Triggers:
#   * workflow_call from build.yml (every push to main, tag, PR)
#   * workflow_dispatch -- ad-hoc rebuild
#
# Folded into build.yml as a DAG leaf 2026-05-25 so each push shows
# exactly ONE Actions entry instead of two parallel runs.

name: pkgdown

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MAKEFLAGS: "-j4"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: r-lib/actions/setup-pandoc@2e3959d284a9ed60162f28a0f9891d1150f47f72 # v2
      - uses: r-lib/actions/setup-r@2e3959d284a9ed60162f28a0f9891d1150f47f72 # v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Pre-install rmoriebricklayer (r-universe; not yet on CRAN)
        run: install.packages("rmoriebricklayer", repos = c("https://rootcoder007.r-universe.dev", "https://cloud.r-project.org"))
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@2e3959d284a9ed60162f28a0f9891d1150f47f72 # v2
        with:
          cache-version: 2
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)'

      - name: Upload Pages artifact
        # v5.0.0 bundles upload-artifact@v7 internally (Node 24);
        # v3.0.1 still used upload-artifact@v4 (Node 20, deprecated).
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    # The `github-pages` environment is restricted (by default) to
    # the main branch -- PR builds run from `refs/pull/N/merge` and
    # get rejected with "Branch is not allowed to deploy to
    # github-pages due to environment protection rules". Build the
    # site on every push/PR so we catch breakage early, but only
    # PUBLISH from main. PR previews can be downloaded from the
    # build job's artifact.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
