# SPDX-License-Identifier: AGPL-3.0-or-later
#
# pkgdown.yml -- build + deploy the rmorie pkgdown site to GitHub
# Pages at https://rootcoder007.github.io/rmorie/.
#
# Triggers:
#   * workflow_call from build.yml (every push to main, tag, PR)
#   * workflow_dispatch -- ad-hoc rebuild
#
# Folded into build.yml as a DAG leaf 2026-05-25 so each push shows
# exactly ONE Actions entry instead of two parallel runs.

name: pkgdown

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Cold-cache dep builds (every main push: PR caches are branch-scoped)
    # historically hung the runner past 2h; fail fast instead.
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MAKEFLAGS: "-j4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-pandoc@b7484da46de19a964f8831f505d2fcf84d1663ec # v2
      - uses: r-lib/actions/setup-r@b7484da46de19a964f8831f505d2fcf84d1663ec # v2
        with:
          r-version: 'release'
          use-public-rspm: true
          extra-repositories: |
            https://rootcoder007.r-universe.dev
            https://stan-dev.r-universe.dev

      # pak's worker processes run vanilla R and never read any Rprofile, so
      # repos set there (including use-public-rspm's) are invisible to it --
      # it fell back to cran.rstudio.com SOURCE and compiled 118 deps until
      # the job timed out. PKG_CRAN_MIRROR is pak's own env knob and env
      # survives vanilla subprocesses. RSPM is Linux-only, so other legs
      # are untouched.
      - name: Point pak at the P3M binary mirror
        shell: bash
        run: |
          if [ -n "${RSPM:-}" ]; then
            echo "PKG_CRAN_MIRROR=${RSPM}" >> "$GITHUB_ENV"
            echo "pak CRAN mirror -> ${RSPM}"
          fi

      # rmoriebricklayer ships a compiled libcurl fetch core, and this job
      # builds it from source (r-universe has no binary for this R/OS combo,
      # and setup-r-dependencies below pulls it from GitHub). Without the
      # headers the C++ compile fails and takes the whole site build with it.
      - name: System libraries for the bricklayer C++ core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Pre-install rmoriebricklayer (r-universe; not yet on CRAN)
        run: install.packages(c("rmoriebricklayer", "rmoriedata"), repos = c("https://rootcoder007.r-universe.dev", "https://cloud.r-project.org"))
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@b7484da46de19a964f8831f505d2fcf84d1663ec # v2
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          # ECOSolveR (via HonestDiD) vendors a SuiteSparse/AMD Makefile that
          # races under parallel make whenever the dep cache misses — on main
          # that is EVERY run (PR caches are branch-scoped). Killed two main
          # runs (2026-07-09) as silent 80-140min runner hangs. Build the dep
          # tree serially, same as r-cmd-check.yml / r-coverage.yml.
          MAKEFLAGS: "-j1"
        with:
          cache-version: 2
          extra-packages: any::pkgdown, local::. github::rootcoder007/rmorie-bricklayer github::rootcoder007/rmoriedata github::stan-dev/cmdstanr
          needs: website

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)'

      - name: Upload Pages artifact
        # v5.0.0 bundles upload-artifact@v7 internally (Node 24);
        # v3.0.1 still used upload-artifact@v4 (Node 20, deprecated).
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    # The `github-pages` environment is restricted (by default) to
    # the main branch -- PR builds run from `refs/pull/N/merge` and
    # get rejected with "Branch is not allowed to deploy to
    # github-pages due to environment protection rules". Build the
    # site on every push/PR so we catch breakage early, but only
    # PUBLISH from main. PR previews can be downloaded from the
    # build job's artifact.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
