version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    open-pull-requests-limit: 5
    # Group all github-actions bumps into ONE weekly PR instead of N.
    # Eliminates the per-action PR spam (was 5+ branches open at once).
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"

  # Dockerfile base image (rocker/r-ver) -- otherwise unwatched.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns:
          - "*"
